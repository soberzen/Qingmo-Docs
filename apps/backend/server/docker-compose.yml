services:
  qingmo-postgresql:
    image: postgres:18-alpine
    container_name: qingmo-postgresql
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qingmo_dev
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_timezone=Asia/Shanghai
    volumes:
      - qingmo-postgresql-data:/var/lib/postgresql

  qingmo-redis:
    image: redis:8-alpine
    container_name: qingmo-redis
    ports:
      - '6379:6379'
    command:
      - redis-server
      - --appendonly
      - 'yes'
    volumes:
      - qingmo-redis-data:/data

networks:
  default:
    name: qingmo-network
    driver: bridge

volumes:
  qingmo-postgresql-data:
  qingmo-redis-data:
