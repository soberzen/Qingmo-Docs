services:
  qingmo-postgresql:
    image: postgres:18
    ports:
      - '${DB_PORT}:5432'
    environment:
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: '${DB_NAME}'
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_timezone=Asia/Shanghai
    volumes:
      - qingmo-postgresql-data:/var/lib/postgresql
    networks:
      - qingmo-network
  qingmo-redis:
    image: redis:8
    ports:
      - '${REDIS_PORT}:6379'
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - '${REDIS_PASSWORD}'
    volumes:
      - qingmo-redis-data:/data
    networks:
      - qingmo-network

networks:
  qingmo-network:
    driver: bridge

volumes:
  qingmo-postgresql-data:
  qingmo-redis-data:
