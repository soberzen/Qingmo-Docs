<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>轻墨文档</title>
    <style>
      .luma-boot-loading {
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }

      .luma-boot-spin {
        position: relative;
        width: 65px;
        aspect-ratio: 1 / 1;
        flex-shrink: 0;
      }

      .luma-boot-spin span {
        position: absolute;
        border-radius: 9999px;
        box-shadow: inset 0 0 0 3px #111111;
        animation: luma-boot-spin 2.5s infinite;
      }

      .luma-boot-spin span:nth-child(2) {
        animation-delay: -1.25s;
      }

      @keyframes luma-boot-spin {
        0% {
          inset: 0 35px 35px 0;
        }
        12.5% {
          inset: 0 35px 0 0;
        }
        25% {
          inset: 35px 35px 0 0;
        }
        37.5% {
          inset: 35px 0 0 0;
        }
        50% {
          inset: 35px 0 0 35px;
        }
        62.5% {
          inset: 0 0 0 35px;
        }
        75% {
          inset: 0 0 35px 35px;
        }
        87.5% {
          inset: 0 0 35px 0;
        }
        100% {
          inset: 0 35px 35px 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="luma-boot-loading">
        <div role="status" aria-label="加载中..." class="luma-boot-spin">
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
